<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL - Shop TBD</title>
    <link rel="icon" href="https://img.icons8.com/fluent/48/000000/shop.png" type="image/x-icon">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: #2c3e50; }
        .header-main .logo-text { font-size: 1.8em; font-weight: 900; color: #ff5722; text-decoration: none; }
        
        .admin-panel { background-color: #fff; margin-top: 20px; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .admin-header { border-bottom: 2px solid #ff5722; padding-bottom: 10px; margin-bottom: 20px; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .admin-input, .admin-select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .add-btn { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
        .add-btn:hover { background-color: #218838; }
        .stock-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .stock-table th, .stock-table td { border: 1px solid #eee; padding: 10px; text-align: left; }
        .stock-table th { background: #f8f8f8; color: #ff5722; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header-main">
        <div class="container"><a href="index.html" class="logo-text">Shop TBD (ADMIN)</a></div>
    </header>

    <main class="container">
        <div class="admin-panel">
            <h2 class="admin-header">🛠️ QUẢN LÝ KHO ACC - THE FORGE</h2>
            
            <div style="background: #f9f9f9; padding: 20px; border-radius: 8px;">
                <div class="form-group">
                    <label>Chọn Loại Dịch Vụ:</label>
                    <select id="serviceSelect" class="admin-select" onchange="filterStock()">
                        <option value="100% Arcane Pickaxe + Random Race">100% Arcane Pickaxe + Random Race</option>
                        <option value="Arcane, Magma, Demonic Pickaxe">Arcane, Magma, Demonic Pickaxe</option>
                        <option value="Arcane, Magma + Mythic Race">Arcane, Magma + Mythic Race</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tài khoản:</label>
                    <input type="text" id="accUser" class="admin-input" placeholder="Nhập username...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="text" id="accPass" class="admin-input" placeholder="Nhập password...">
                </div>
                <button class="add-btn" onclick="addAccount()">THÊM VÀO KHO NGAY</button>
            </div>

            <div style="margin-top: 30px;">
                <h3>📦 KHO HIỆN TẠI (<span id="totalCount">0</span>)</h3>
                <table class="stock-table">
                    <thead><tr><th>Dịch Vụ</th><th>User</th><th>Pass</th><th>Xóa</th></tr></thead>
                    <tbody id="stockTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBtTKQCFN9Y983H2V88n17oMYRMoolQ",
            authDomain: "shop-tbd.firebaseapp.com",
            projectId: "shop-tbd",
            storageBucket: "shop-tbd.firebaseapp.com",
            messagingSenderId: "777222985748",
            appId: "1:777222985748:web:94a9deF4894a3dd7b6f01",
            measurementId: "G-ZR4F57QMJX8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        if (localStorage.getItem('currentUser') !== 'Tri') {
            document.body.innerHTML = "<h1 style='text-align:center; color:red; margin-top:50px;'>NO ACCESS</h1>";
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        }

        async function addAccount() {
            const service = document.getElementById('serviceSelect').value;
            const user = document.getElementById('accUser').value.trim();
            const pass = document.getElementById('accPass').value.trim();

            if (!user || !pass) return alert("Thiếu thông tin!");

            try {
                await db.collection("stock_theforge").add({
                    service: service, username: user, password: pass,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Đã thêm!");
                document.getElementById('accUser').value = '';
                document.getElementById('accPass').value = '';
            } catch (error) { alert("Lỗi: " + error.message); }
        }

        function loadStock() {
            const filter = document.getElementById('serviceSelect').value;
            db.collection("stock_theforge").where("service", "==", filter).onSnapshot((snapshot) => {
                const tbody = document.getElementById('stockTableBody');
                tbody.innerHTML = '';
                document.getElementById('totalCount').innerText = snapshot.size;
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td>${d.service}</td><td>${d.username}</td><td>${d.password}</td>
                            <td><button class="delete-btn" onclick="deleteAcc('${doc.id}')">Xóa</button></td>
                        </tr>`;
                });
            });
        }

        function deleteAcc(id) {
            if (confirm("Xóa acc này?")) db.collection("stock_theforge").doc(id).delete();
        }

        function filterStock() { loadStock(); }
        document.addEventListener('DOMContentLoaded', loadStock);
    </script>
</body>
</html>
