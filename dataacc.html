<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL - Quản Lý Kho</title>
    <link rel="icon" href="https://img.icons8.com/fluent/48/000000/shop.png" type="image/x-icon">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        .header-main { padding: 15px; background-color: #2c3e50; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-size: 1.5em; font-weight: 900; color: #ff5722; text-decoration: none; }
        
        .admin-panel { background-color: #fff; margin-top: 20px; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .admin-header { border-bottom: 2px solid #ff5722; padding-bottom: 10px; margin-bottom: 20px; color: #2c3e50; text-transform: uppercase; }
        
        .form-section { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        .admin-input, .admin-select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; }
        .admin-input:focus { border-color: #ff5722; }
        
        .add-btn { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; }
        .add-btn:hover { background-color: #218838; }

        .stock-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .stock-table th, .stock-table td { border: 1px solid #eee; padding: 10px; text-align: left; }
        .stock-table th { background-color: #2c3e50; color: white; }
        .delete-btn { background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; border: none; }
        
        .badge { background: #ff5722; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .logout-btn { color: white; text-decoration: none; font-weight: bold; background: #c0392b; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="header-main">
        <div class="container" style="display:flex; justify-content:space-between; width:100%">
            <a href="index.html" class="logo-text">Shop TBD (ADMIN)</a>
            <div>
                <span id="adminNameDisplay" style="color:white; margin-right:10px;">Xin chào, Admin</span>
                <a href="index.html" class="logout-btn">Thoát</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="admin-panel">
            <h2 class="admin-header">🛠️ QUẢN LÝ KHO ACC - ĐA GAME</h2>
            
            <div class="form-section">
                <div class="form-group">
                    <label style="color:#ff5722; font-size:1.1em;">BƯỚC 1: CHỌN GAME MUỐN THÊM ACC</label>
                    <select id="gameSelect" class="admin-select" onchange="updateServiceList()">
                        <option value="theforge">The Forge</option>
                        <option value="99nights">99 Nights</option>
                        <option value="adoptme">Adopt Me</option>
                        <option value="bloxfruits">Blox Fruits</option>
                        <option value="fisch">Fisch</option>
                        <option value="fischit">Fisch IT</option>
                        <option value="plantvsbrainrot">Plant vs Brainrot</option>
                        <option value="stealabrainrot">Steal A Brainrot</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>BƯỚC 2: CHỌN LOẠI ACC</label>
                    <select id="serviceSelect" class="admin-select" onchange="loadStock()">
                        </select>
                </div>

                <div class="form-group">
                    <label>Tài khoản:</label>
                    <input type="text" id="accUser" class="admin-input" placeholder="Nhập username...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="text" id="accPass" class="admin-input" placeholder="Nhập password...">
                </div>

                <button class="add-btn" onclick="addAccount()">LƯU VÀO KHO</button>
            </div>

            <div style="margin-top: 30px;">
                <h3>📦 KHO HIỆN TẠI: <span id="currentCollectionName" style="color:#007bff">...</span> (<span id="totalCount">0</span>)</h3>
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>Dịch Vụ</th>
                            <th>Tài Khoản</th>
                            <th>Mật Khẩu</th>
                            <th width="80">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // CẤU HÌNH FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBtTKQCFN9Y983H2V88n17oMYRMoolQ",
            authDomain: "shop-tbd.firebaseapp.com",
            projectId: "shop-tbd",
            storageBucket: "shop-tbd.firebaseapp.com",
            messagingSenderId: "777222985748",
            appId: "1:777222985748:web:94a9deF4894a3dd7b6f01",
            measurementId: "G-ZR4F57QMJX8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- BẢO MẬT: CHỈ ADMIN MỚI VÀO ĐƯỢC ---
        const ALLOWED_ADMINS = ['Tri', 'zyydai'];
        const currentUser = localStorage.getItem('currentUser');

        if (!ALLOWED_ADMINS.includes(currentUser)) {
            document.body.innerHTML = "<h1 style='text-align:center; color:red; margin-top:50px;'>BẠN KHÔNG CÓ QUYỀN TRUY CẬP!</h1>";
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        } else {
            document.getElementById('adminNameDisplay').innerText = "Xin chào, " + currentUser;
        }

        // --- CẤU HÌNH DANH SÁCH DỊCH VỤ ---
        const GAME_DATA = {
            "theforge": {
                collection: "stock_theforge",
                services: [
                    "100% Arcane Pickaxe + Random Race",
                    "Arcane, Magma, Demonic Pickaxe",
                    "Arcane, Magma + Mythic Race"
                ]
            },
            "99nights": {
                collection: "stock_99nights",
                services: [
                    "ACC 99 NIGHTS 500 - 1000 DIAMOND",
                    "ACC 99 NIGHTS 1000 - 1200 DIAMOND",
                    "ACC 99 NIGHTS 1200 - 1500 DIAMOND",
                    "ACC 99 NIGHTS 1500 - 2000 DIAMOND",
                    "ACC 99 NIGHTS 2000 - 2500 DIAMOND",
                    "ACC 99 NIGHTS 2500 - 3000 DIAMOND",
                    "ACC 99 NIGHTS 3000 - 3500 DIAMOND",
                    "ACC 99 NIGHTS 3500 - 4000 DIAMOND",
                    "ACC 99 NIGHTS 4000 - 5000 DIAMOND"
                ]
            },
            "adoptme": {
                collection: "stock_adoptme",
                services: [
                    "Adopt Me RANDOM 50 Potions ĐẾN 100+ Potions",
                    "Adopt Me 60K+ Bucks , 100+ Potions",
                    "Adopt Me RANDOM 150 Potions",
                    "Adopt Me 200+ Potions",
                    "Adopt Me RANDOM 250 - 300 Potions",
                    "Adopt Me 180K+ Bucks , 300+ Potions",
                    "Adopt Me RANDOM 350 - 400 Potions"
                ]
            },
            "bloxfruits": {
                collection: "stock_bloxfruits",
                services: [
                    "GOD LV 2800 Random Soul Guitar",
                    "GOD LV 2800 CÓ TRÁI PORTAL TRONG RƯƠNG",
                    "GOD LV 2800 CÓ TRÁI BUDDHA TRONG RƯƠNG",
                    "CELEBRITY MANSION",
                    "GOD LV 2800 CÓ TRÁI MAMMOTH TRONG RƯƠNG",
                    "GOD LV 2800 CÓ TRÁI GRAVITY TRONG RƯƠNG",
                    "GOD LV 2800 CÓ TRÁI GAS TRONG RƯƠNG",
                    "GOD LV 2800 CÓ TRÁI PAIN",
                    "GOD LV 2800 100% CÓ THÊM RANDOM 1 TRÁI ĐỎ",
                    "GOD LV 2800 CÓ TRÁI TREX TRONG RƯƠNG",
                    "GOD LV 2800 + Tiger",
                    "GOD LV 2800 Valkyrie Helm + Mirror Fractal",
                    "GOD LV 2800 100% CÓ THÊM RANDOM 2 TRÁI ĐỎ",
                    "GOD LV 2800 CÓ TRÁI DOUGH TRONG RƯƠNG",
                    "GOD 2800 + Cursed Dual Katana + Valkyrie Helm + Mirror Fractal",
                    "GOD LV 2800 100% RANDOM 3 TRÁI ĐỎ",
                    "GOD LV 2800 + 1 GEAR + RANDOM RACE",
                    "GOD LV 2800 CÓ TRÁI YETI TRONG RƯƠNG",
                    "GOD LV 2800 MOCHI V2",
                    "GOD LV 2800 ( 4 - 6 TRÁI ĐỎ )TRONG RƯƠNG",
                    "GOD LV 2800 V4 FULL GEAR + SKY + T10",
                    "GOD LV 2800 + CDK + Cy + V4 FULL GEAR",
                    "GOD LV 2800 + CDK + V4 FULL GEAR + Ghoul + T10",
                    "GOD LV 2750 CÓ ( 5 - 7 TRÁI ĐỎ )TRONG RƯƠNG",
                    "GOD LV 2800 CÓ TRÁI KIT TRONG RƯƠNG",
                    "GOD LV 2750 + 7 RACE + V4 FULL GEAR",
                    "ACC CÓ TRÁI DRAGON TRONG RƯƠNG"
                ]
            },
            "fisch": {
                collection: "stock_fisch",
                services: [
                    "Random 500-1000 Level Random Unlock 10 - 45 % ROD, Chance Many Coin, Many Fish",
                    "Random 1000 Level + Random Unlock 10 - 45 % ROD, Chance Many Coin, Many Fish",
                    "Fisch Level Max Random Unlock 35 - 55 % ROD, Chance Many Coin, Many Fish"
                ]
            },
            "fischit": {
                collection: "stock_fischit",
                services: [
                    "Ghostfinn Rod + coin random...",
                    "Astral Rod + item random,coin....",
                    "Acc Pack 10M Fish Mythic Value",
                    "40% Ghostfinn Rod + 100% rod mythic + rod random...",
                    "Ares Rod,Astral Rod,Random Item,..."
                ]
            },
            "plantvsbrainrot": {
                collection: "stock_plantvsbrainrot",
                services: [
                    "Mr carrot : Plant vs Brainrot",
                    "Tommatrio : Plant vs Brainrot",
                    "Shroombino : Plant vs Brainrot",
                    "Mango - Plant vs Brainrot",
                    "Plant vs Brainrot 1- 3 Secret Seeds + Random Secret + Item,...",
                    "Plant vs Brainrot 4- 6 Secret Seeds + Random Secret + Item,...",
                    "7-11 Rebirths Reached 10- 30 Secret Seeds + Random Secret + Item,...",
                    "8-10 Rebirths Reached 10- 30 Secret Seeds + Random Secret + Item,..."
                ]
            },
            "stealabrainrot": {
                collection: "stock_stealabrainrot",
                services: [
                    "La Vacca",
                    "P100% Secret Random Cash 50M - 500M",
                    "Steal A Brainrot : 100% 6 GOD Random ( 5M - 100M )",
                    "Steal A Brainrot : 100% 6 GOD Random ( 25M - 50M )",
                    "Steal A Brainrot : 100% 5 Secret",
                    "Steal A Brainrot : 100% 3 Secret Random",
                    "Chimpanzini Spiderini",
                    "Tralala Rainbow",
                    "Sammy Spyderini",
                    "Matteo Rainbow",
                    "Los Tralalelitos",
                    "Las Tralaleritas",
                    "Graipuss Medusi",
                    "Chicleteira Bicicleteira",
                    "La Grande Combinasion",
                    "+1 PET PEN SLOT"
                ]
            }
        };

        let currentCollection = "";

        // HÀM CẬP NHẬT DANH SÁCH DỊCH VỤ KHI CHỌN GAME
        function updateServiceList() {
            const gameKey = document.getElementById('gameSelect').value;
            const serviceSelect = document.getElementById('serviceSelect');
            const data = GAME_DATA[gameKey];

            currentCollection = data.collection;
            document.getElementById('currentCollectionName').innerText = currentCollection;

            // Xóa cũ
            serviceSelect.innerHTML = "";

            // Thêm mới
            data.services.forEach(service => {
                const option = document.createElement("option");
                option.value = service;
                option.text = service;
                serviceSelect.appendChild(option);
            });

            // Tải lại bảng kho
            loadStock();
        }

        // HÀM THÊM ACC
        async function addAccount() {
            const service = document.getElementById('serviceSelect').value;
            const user = document.getElementById('accUser').value.trim();
            const pass = document.getElementById('accPass').value.trim();

            if (!user || !pass) return alert("Thiếu thông tin Acc/Pass!");

            try {
                await db.collection(currentCollection).add({
                    service: service,
                    username: user,
                    password: pass,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`Đã thêm acc vào kho [${currentCollection}]!`);
                document.getElementById('accUser').value = '';
                document.getElementById('accPass').value = '';
            } catch (error) {
                alert("Lỗi: " + error.message);
            }
        }

        // HÀM TẢI KHO (REALTIME)
        let unsubscribe = null; 

        function loadStock() {
            const filterService = document.getElementById('serviceSelect').value;
            const tbody = document.getElementById('stockTableBody');

            if (unsubscribe) unsubscribe();

            tbody.innerHTML = '<tr><td colspan="4">Đang tải...</td></tr>';

            unsubscribe = db.collection(currentCollection)
                .where("service", "==", filterService)
                .onSnapshot((snapshot) => {
                    tbody.innerHTML = '';
                    document.getElementById('totalCount').innerText = snapshot.size;

                    if (snapshot.empty) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Kho đang trống loại này.</td></tr>';
                        return;
                    }

                    snapshot.forEach((doc) => {
                        const d = doc.data();
                        tbody.innerHTML += `
                            <tr>
                                <td><b>${d.service}</b></td>
                                <td>${d.username}</td>
                                <td>${d.password}</td>
                                <td><button class="delete-btn" onclick="deleteAcc('${doc.id}')">Xóa</button></td>
                            </tr>
                        `;
                    });
                });
        }

        function deleteAcc(id) {
            if (confirm("Xóa acc này khỏi kho?")) {
                db.collection(currentCollection).doc(id).delete();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateServiceList();
        });

    </script>
</body>
</html>
