<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop TBD - Acc The Forge</title>
    <link rel="icon" href="https://img.icons8.com/fluent/48/000000/shop.png" type="image/x-icon">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        /* CSS CHUẨN ĐỒNG BỘ */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; outline: none; }
        
        .header-main { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: #2c3e50; }
        .header-main .logo-text { font-size: 1.8em; font-weight: 900; color: #ff5722; letter-spacing: 1px; }
        .top-bar { background-color: #f8f8f8; padding: 8px 0; font-size: 0.9em; border-bottom: 1px solid #eee; }
        .top-bar .container { display: flex; justify-content: space-between; align-items: center; }
        .top-bar-left input { padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; margin-right: 5px; }
        .top-bar-left button { background-color: #007bff; color: white; padding: 5px 10px; border-radius: 4px; }
        .top-bar-right { display: flex; align-items: center; gap: 15px; }
        .top-up-btn { background-color: #ff0077; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        
        .main-banner { margin-top: 20px; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .main-banner img { width: 100%; display: block; }
        .products-section { background-color: #fff; margin-top: 20px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .products-header h2 { margin: 0 0 20px 0; color: #ff5722; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background-color: #f9f9f9; border: 1px solid #eee; border-radius: 8px; overflow: hidden; text-align: center; transition: 0.3s; position: relative; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-card .tag { background-color: #ff0077; color: white; font-size: 0.75em; padding: 3px 8px; position: absolute; top: 0; left: 0; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid #eee; }
        .product-card .info { padding: 15px; }
        .product-card h4 { margin: 0 0 10px; font-size: 1.1em; color: #333; height: 3.6em; overflow: hidden; }
        .product-card .price { font-size: 1.2em; color: #ff0077; font-weight: bold; margin-bottom: 15px; display: block; }
        .buy-btn { background-color: #222; color: #fff; border: 1px solid #ff5722; border-radius: 6px; padding: 10px; width: 100%; font-weight: bold; }
        .buy-btn:hover { background-color: #ff5722; }

        /* STOCK COUNT CSS */
        .stock-count { display: block; font-size: 0.9em; font-weight: bold; color: #27ae60; margin-bottom: 10px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #242424; padding: 30px; border-radius: 8px; width: 90%; max-width: 450px; text-align: center; color: white; position: relative; }
        .close-icon { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        .custom-input { width: 100%; padding: 10px; background: #1e1e1e; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .confirm-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #customAlert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .alert-box { background: white; padding: 25px; border-radius: 10px; width: 320px; text-align: center; }
        .alert-box button { background: #ff5722; color: white; padding: 8px 20px; border: none; border-radius: 4px; margin-top: 15px; cursor: pointer; }
        .footer { background-color: #2c3e50; color: #ecf0f1; padding: 20px; text-align: center; margin-top: 30px; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 100%; background: white; box-shadow: 0 5px 10px rgba(0,0,0,0.1); border-radius: 6px; min-width: 150px; z-index: 100; text-align: left; }
        .dropdown-content.show { display: block; }
        .dropdown-content a { display: block; padding: 10px; color: #333; border-bottom: 1px solid #eee; }
        .dropdown-content .header { padding: 10px; font-weight: bold; background: #eee; }
    </style>
</head>
<body>

    <header>
        <div class="header-main"><div class="container"><a href="index.html" class="logo-text">Shop TBD</a></div></div>
        <div class="top-bar">
            <div class="container">
                <div class="top-bar-left"><input type="text" placeholder="Tìm kiếm..."><button>🔍</button></div>
                <div class="top-bar-right">
                    <button class="top-up-btn" onclick="location.href='index.html'">Nạp tiền</button>
                    <div id="auth-status-area"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="main-banner"><img src="https://staticg.sportskeeda.com/editor/2023/09/da5e0-16958857892879-1920.jpg"></div>
        <div class="products-section">
            <div class="products-header"><h2>DANH SÁCH ACC THE FORGE</h2></div>
            <div class="product-grid">
                
                <div class="product-card">
                    <div class="tag">HOT</div>
                    <img src="https://imagedelivery.net/V4X6G9LNxVfPrT3U5oXrIw/07412f81-a4f0-4bf8-50da-b40b96c7c900/public">
                    <div class="info">
                        <h4>100% Arcane Pickaxe + Random Race</h4>
                        <span class="stock-count" id="stock-100% Arcane Pickaxe + Random Race">Đang tải...</span>
                        <span class="price">950,000 VNĐ</span>
                        <button class="buy-btn" onclick="openModal('100% Arcane Pickaxe + Random Race', 950000)">MUA NGAY</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="tag">LEGEND</div>
                    <img src="https://imagedelivery.net/V4X6G9LNxVfPrT3U5oXrIw/cdf9e4fa-4398-4dd7-977b-3afe42026400/public">
                    <div class="info">
                        <h4>Arcane, Magma, Demonic Pickaxe</h4>
                        <span class="stock-count" id="stock-Arcane, Magma, Demonic Pickaxe">Đang tải...</span>
                        <span class="price">1,250,000 VNĐ</span>
                        <button class="buy-btn" onclick="openModal('Arcane, Magma, Demonic Pickaxe', 1250000)">MUA NGAY</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="tag">VIP</div>
                    <img src="https://imagedelivery.net/V4X6G9LNxVfPrT3U5oXrIw/124efd35-b977-46d2-2fc3-705ed6dc5c00/public">
                    <div class="info">
                        <h4>Arcane, Magma + Mythic Race</h4>
                        <span class="stock-count" id="stock-Arcane, Magma + Mythic Race">Đang tải...</span>
                        <span class="price">680,000 VNĐ</span>
                        <button class="buy-btn" onclick="openModal('Arcane, Magma + Mythic Race', 680000)">MUA NGAY</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="confirmPurchaseModal" class="modal">
        <div class="modal-content">
            <span class="close-icon" onclick="closeModal()">&times;</span>
            <h2 style="color: #ff5722;">XÁC NHẬN MUA ACC</h2>
            <div class="input-group"><label>Sản phẩm:</label><input type="text" id="modalPName" class="custom-input" readonly></div>
            <div class="input-group"><label>Giá tiền:</label><input type="text" id="modalPPrice" class="custom-input" readonly style="color:#2ecc71; font-weight:bold;"></div>
            <div class="input-group"><label>Ghi chú:</label><input type="text" id="modalNote" class="custom-input" placeholder="Ví dụ: Mua giúp bạn..."></div>
            <button class="confirm-btn" onclick="handlePurchase()">THANH TOÁN</button>
        </div>
    </div>
    <div id="customAlert"><div class="alert-box"><h3 id="alertTitle"></h3><p id="alertMessage"></p><button onclick="document.getElementById('customAlert').style.display='none'">Đóng</button></div></div>
    <footer class="footer"><div class="container"><p>&copy; 2024 Shop TBD.</p></div></footer>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1341974823944978453/mKyLCzGzPWJ45BKkJ4MmT9pioqJckpXwXjbt9JPOxN8fzXkD0wIGiVVg_o77I1BZ3Vox";
        const firebaseConfig = { apiKey: "AIzaSyBtTKQCFN9Y983H2V88n17oMYRMoolQ", authDomain: "shop-tbd.firebaseapp.com", projectId: "shop-tbd", storageBucket: "shop-tbd.firebaseapp.com", messagingSenderId: "777222985748", appId: "1:777222985748:web:94a9deF4894a3dd7b6f01", measurementId: "G-ZR4F57QMJX8" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentItem = null;

        // CẤU HÌNH COLLECTION KHO CHO FILE NÀY
        const COLLECTION_NAME = "stock_theforge";

        function showAlert(t, m, e=false) { document.getElementById('alertTitle').innerText=t; document.getElementById('alertMessage').innerHTML=m; document.getElementById('customAlert').style.display='flex'; }
        function openModal(n, p) { if(!localStorage.getItem('currentUser')) return showAlert("Lỗi","Đăng nhập đi!"); currentItem={name:n, price:p}; document.getElementById('modalPName').value=n; document.getElementById('modalPPrice').value=p.toLocaleString()+" VNĐ"; document.getElementById('confirmPurchaseModal').style.display='flex'; }
        function closeModal() { document.getElementById('confirmPurchaseModal').style.display='none'; }

        // HÀM CẬP NHẬT TỒN KHO REALTIME
        function updateStockCounts() {
            db.collection(COLLECTION_NAME).where('status', '==', 'chua').onSnapshot(snapshot => {
                const counts = {};
                snapshot.forEach(doc => {
                    const service = doc.data().service;
                    counts[service] = (counts[service] || 0) + 1;
                });
                document.querySelectorAll('.stock-count').forEach(el => {
                    const id = el.id.replace('stock-', '');
                    const count = counts[id] || 0;
                    el.textContent = count > 0 ? `Còn lại: ${count} acc` : `Hết hàng`;
                    el.style.color = count > 0 ? '#27ae60' : '#e74c3c';
                });
            });
        }

        async function handlePurchase() {
            const user = localStorage.getItem('currentUser');
            const note = document.getElementById('modalNote').value;
            if(!user) return;
            try {
                await db.runTransaction(async (t) => {
                    const userRef = db.collection("users").doc(user);
                    const uDoc = await t.get(userRef);
                    if(uDoc.data().balance < currentItem.price) throw "Số dư không đủ!";
                    const q = await db.collection(COLLECTION_NAME).where("service", "==", currentItem.name).where("status", "==", "chua").limit(1).get();
                    if(q.empty) throw "Hết hàng!";
                    const acc = q.docs[0].data();
                    t.update(userRef, { balance: uDoc.data().balance - currentItem.price });
                    t.update(q.docs[0].ref, { status: 'da', soldTo: user, soldAt: firebase.firestore.FieldValue.serverTimestamp() });
                    t.set(db.collection("user_purchases").doc(), {
                        username: user, item_name: currentItem.name, price: currentItem.price,
                        acc_username: acc.username, acc_password: acc.password,
                        note: note, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    window.boughtAcc = acc;
                });
                if(DISCORD_WEBHOOK_URL) fetch(DISCORD_WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ content: "@everyone", embeds: [{ title: "🔥 MUA ACC THE FORGE", fields: [{name:"Khách",value:user},{name:"Gói",value:currentItem.name}] }] }) });
                closeModal();
                showAlert("Thành công", `TK: ${window.boughtAcc.username}<br>MK: ${window.boughtAcc.password}`);
                checkAuth();
            } catch(e) { showAlert("Lỗi", e.message || e); }
        }

        async function checkAuth() {
            const u = localStorage.getItem('currentUser');
            if(u) {
                const d = await db.collection("users").doc(u).get();
                if(d.exists) document.getElementById('auth-status-area').innerHTML = `<div class="dropdown" onclick="this.querySelector('.dropdown-content').classList.toggle('show')"><button style="background:none;border:none;font-weight:bold;cursor:pointer">👤 ${u} ▼</button><div class="dropdown-content"><div class="header">Ví: ${d.data().balance.toLocaleString()}đ</div><a href="taikhoan.html">Quản lý</a><a href="#" onclick="localStorage.removeItem('currentUser');location.reload()">Đăng xuất</a></div></div>`;
            } else document.getElementById('auth-status-area').innerHTML = `<button onclick="location.href='index.html'">Đăng nhập</button>`;
        }
        document.addEventListener('DOMContentLoaded', () => { checkAuth(); updateStockCounts(); });
        window.onclick = e => { if(!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown-content').forEach(d=>d.classList.remove('show')); if(e.target==document.getElementById('confirmPurchaseModal')) closeModal(); }
    </script>
</body>
</html>
