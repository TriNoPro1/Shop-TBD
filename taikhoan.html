<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tài Khoản - Shop TBD</title>
    <link rel="icon" href="https://img.icons8.com/fluent/48/000000/shop.png" type="image/x-icon">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; }
        .header-main { width: 100%; background-color: #2c3e50; padding: 10px 0; margin-bottom: 20px; }
        .header-main a { color: #ff5722; font-size: 1.8em; font-weight: 900; text-decoration: none; margin-left: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }
        .profile-header { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .profile-header img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #ff5722; }
        .user-info h2 { margin: 0; color: #2c3e50; }
        .user-info p { margin: 5px 0; color: #666; font-weight: bold; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .info-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; border-bottom: 4px solid #ff5722; }
        .info-card h3 { margin-top: 0; font-size: 0.9em; color: #7f8c8d; text-transform: uppercase; }
        .info-card .value { font-size: 1.4em; font-weight: bold; color: #2c3e50; }
        .btn-home { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #2c3e50; color: white; border-radius: 5px; text-decoration: none; font-weight: bold; }
        #customAlert { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; display: none; justify-content: center; align-items: center; }
        .alert-content { background: white; padding: 25px; border-radius: 10px; width: 320px; text-align: center; }
    </style>
</head>
<body>
    <header class="header-main"><div class="container"><a href="index.html">Shop TBD</a></div></header>
    <main class="container">
        <div class="profile-header">
            <img src="https://tse2.mm.bing.net/th/id/OIP.vg41yG82qw84ziz5nS-CWQHaHa?pid=Api&P=0&h=180" alt="Avatar">
            <div class="user-info">
                <h2 id="display-username">Đang tải...</h2>
                <p id="display-uid">ID: #000000</p>
                <a href="index.html" class="btn-home">Quay về cửa hàng</a>
            </div>
        </div>
        <div class="info-grid">
            <div class="info-card"><h3>Số dư tiền</h3><div class="value" id="val-balance">0đ</div></div>
            <div class="info-card"><h3>Số dư Robux</h3><div class="value" id="val-robux">0</div></div>
            <div class="info-card"><h3>Ngày tham gia</h3><div class="value" id="val-date">--/--/----</div></div>
        </div>
    </main>
    <div id="customAlert"><div class="alert-content"><h3 id="alertTitle" style="color:red"></h3><p id="alertMessage"></p><button onclick="window.location.href='index.html'" style="background:#ff5722;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer">VỀ TRANG CHỦ</button></div></div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBtTKQCFN9Y983H2V88n17oMYRMoolQ", authDomain: "shop-tbd.firebaseapp.com", projectId: "shop-tbd", storageBucket: "shop-tbd.appspot.com", messagingSenderId: "777222985748", appId: "1:777222985748:web:94a9deF4894a3dd7b6f01" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        async function loadProfile() {
            const u = localStorage.getItem('currentUser');
            if(!u) {
                document.getElementById('alertTitle').textContent = "Lỗi!";
                document.getElementById('alertMessage').textContent = "Vui lòng đăng nhập để xem thông tin.";
                document.getElementById('customAlert').style.display = 'flex';
                return;
            }
            const doc = await db.collection("users").doc(u).get();
            if(doc.exists) {
                const d = doc.data();
                document.getElementById('display-username').textContent = u;
                document.getElementById('display-uid').textContent = `ID: #${u.split('').map(c=>c.charCodeAt(0)).join('').substring(0,6)}`;
                document.getElementById('val-balance').textContent = d.balance.toLocaleString() + 'đ';
                document.getElementById('val-robux').textContent = (d.robuxBalance || 0).toLocaleString();
                document.getElementById('val-date').textContent = d.joinDate ? new Date(d.joinDate).toLocaleDateString('vi-VN') : 'Mới tham gia';
            }
        }
        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
